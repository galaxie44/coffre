name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter build windows --release
      - name: Stage dist
        shell: pwsh
        run: |
          if (Test-Path installer/payload) { Remove-Item -Recurse -Force installer/payload }
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item -Recurse -Force apps/coffre/build/windows/x64/runner/Release/* installer/payload/
          if (Test-Path apps/coffre/assets/icon/coffre.ico) {
            Copy-Item apps/coffre/assets/icon/coffre.ico installer/payload/Coffre.ico -Force
          }
          New-Item -ItemType Directory -Force -Path installer/payload/native_host | Out-Null
          Copy-Item -Force extension/native_host/*.py installer/payload/native_host/
          Copy-Item -Force extension/native_host/*.bat installer/payload/native_host/
          Copy-Item -Force extension/native_host/*.json installer/payload/native_host/
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable" }
          & $iscc installer\windows\coffre_wipe.iss
          Copy-Item -Force installer/windows/Output/Coffre-Supprimer-Tout.exe installer/payload/
          & $iscc installer\windows\coffre.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            installer/windows/Output/Coffre-Setup-Windows.exe
            installer/windows/Output/Coffre-Supprimer-Tout.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/coffre/build/app/outputs/flutter-apk/app-release.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Prepare assets
        run: |
          mkdir -p dist/release
          cp "$(find windows-setup -name 'Coffre-Setup-Windows.exe' | head -1)" dist/release/
          cp "$(find windows-setup -name 'Coffre-Supprimer-Tout.exe' | head -1)" dist/release/
          cp "$(find android-apk -name 'app-release.apk' | head -1)" dist/release/Coffre.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/Coffre-Setup-Windows.exe
            dist/release/Coffre-Supprimer-Tout.exe
            dist/release/Coffre.apk
          generate_release_notes: true
          body: |
            ## Téléchargement
            - **Windows** : lancez `Coffre-Setup-Windows.exe`
            - **Android** : ouvrez `Coffre.apk` sur le téléphone
            - **Tout supprimer (Windows)** : `Coffre-Supprimer-Tout.exe` (irréversible)

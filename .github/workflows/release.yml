name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter build windows --release
      - name: Stage dist
        shell: pwsh
        run: |
          if (Test-Path installer/payload) { Remove-Item -Recurse -Force installer/payload }
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Copy-Item -Recurse -Force apps/coffre/build/windows/x64/runner/Release/* installer/payload/
          if (Test-Path apps/coffre/assets/icon/coffre.ico) {
            Copy-Item apps/coffre/assets/icon/coffre.ico installer/payload/Coffre.ico -Force
          }
          New-Item -ItemType Directory -Force -Path installer/payload/native_host | Out-Null
          Copy-Item -Force extension/native_host/*.py installer/payload/native_host/
          Copy-Item -Force extension/native_host/*.bat installer/payload/native_host/
          Copy-Item -Force extension/native_host/*.json installer/payload/native_host/
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable" }
          & $iscc installer\windows\coffre_wipe.iss
          Copy-Item -Force installer/windows/Output/Coffre-Supprimer-Tout.exe installer/payload/
          & $iscc installer\windows\coffre.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            installer/windows/Output/Coffre-Setup-Windows.exe
            installer/windows/Output/Coffre-Supprimer-Tout.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/coffre/build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libappindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter create --platforms=linux .
          flutter build linux --release
      - name: Package Linux
        working-directory: apps/coffre/build/linux/x64/release
        run: tar czf Coffre-Linux-x64.tar.gz -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: apps/coffre/build/linux/x64/release/Coffre-Linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter create --platforms=macos .
          flutter build macos --release
      - name: Package macOS
        working-directory: apps/coffre/build/macos/Build/Products/Release
        run: zip -r Coffre-macOS.zip coffre.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: apps/coffre/build/macos/Build/Products/Release/Coffre-macOS.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS (unsigned)
        working-directory: apps/coffre
        run: |
          flutter pub get
          flutter create --platforms=ios .
          flutter build ios --release --no-codesign
      - name: Package iOS
        working-directory: apps/coffre/build/ios/iphoneos
        run: zip -r Coffre-iOS-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/coffre/build/ios/iphoneos/Coffre-iOS-unsigned.zip

  publish:
    needs: [windows, android, linux, macos, ios]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.windows.result == 'success' &&
      needs.android.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
      - uses: actions/download-artifact@v4
        if: needs.linux.result == 'success'
        continue-on-error: true
        with:
          name: linux-build
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        continue-on-error: true
        with:
          name: macos-build
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        continue-on-error: true
        with:
          name: ios-build
          path: artifacts/ios
      - name: Prepare assets
        run: |
          mkdir -p dist/release
          cp "$(find artifacts/windows -name 'Coffre-Setup-Windows.exe' | head -1)" dist/release/
          cp "$(find artifacts/windows -name 'Coffre-Supprimer-Tout.exe' | head -1)" dist/release/
          cp "$(find artifacts/android -name 'app-release.apk' | head -1)" dist/release/Coffre.apk
          if compgen -G "artifacts/linux/*" > /dev/null; then
            cp "$(find artifacts/linux -name 'Coffre-Linux-x64.tar.gz' | head -1)" dist/release/ || true
          fi
          if compgen -G "artifacts/macos/*" > /dev/null; then
            cp "$(find artifacts/macos -name 'Coffre-macOS.zip' | head -1)" dist/release/ || true
          fi
          if compgen -G "artifacts/ios/*" > /dev/null; then
            cp "$(find artifacts/ios -name 'Coffre-iOS-unsigned.zip' | head -1)" dist/release/ || true
          fi
          ls -la dist/release/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          body: |
            ## Téléchargement
            - **Windows** : lancez `Coffre-Setup-Windows.exe`
            - **Android** : ouvrez `Coffre.apk` sur le téléphone
            - **macOS** : décompressez `Coffre-macOS.zip` → clic droit Ouvrir sur `Coffre.app`
            - **Linux** : extrayez `Coffre-Linux-x64.tar.gz` puis `./coffre`
            - **iOS** : archive non signée pour sideloading (`Coffre-iOS-unsigned.zip`)
            - **Tout supprimer (Windows)** : `Coffre-Supprimer-Tout.exe` (irréversible)
            - **Guide** : [galaxie44.github.io/coffre/aide.html](https://galaxie44.github.io/coffre/aide.html)
            - **Anciennes versions** : [galaxie44.github.io/coffre/versions.html](https://galaxie44.github.io/coffre/versions.html)
